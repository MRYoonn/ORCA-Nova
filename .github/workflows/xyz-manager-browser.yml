name: XYZ Manager and Batch Browser QA
on:
  push:
    branches: ['feat/xyz-manager-batch-ux-*', 'feat/xyz-3d-*', 'feat/batch-presets-*']
  pull_request:
    paths:
      - 'assets/desktop.html'
      - 'tests/batch-ui.cjs'
      - 'tests/xyz-3d-ui.cjs'
      - 'tests/batch-presets-summary-ui.cjs'
      - 'tests/si-ui.cjs'
      - 'tests/update-channels-ui.cjs'
      - 'tests/preset-layout-library-fold-ui.cjs'
      - '.github/workflows/xyz-manager-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright browser test tools
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate embedded app JavaScript syntax
        run: node tests/scientific-ui-syntax.cjs
      - name: Browser regression — XYZ removal and Multi-XYZ Batch
        run: node tests/batch-ui.cjs
      - name: Browser regression — offline XYZ 3D preview
        run: node tests/xyz-3d-ui.cjs
      - name: Browser regression — per-XYZ presets and readable scientific summary
        run: node tests/batch-presets-summary-ui.cjs
      - name: Browser regression — offline SI PDF/text evidence and composite Gibbs UI
        run: node tests/si-ui.cjs
      - name: Browser regression — Stable/Beta update channels and release notes
        run: node tests/update-channels-ui.cjs
      - name: Browser regression — preset-first layout and collapsible library
        run: node tests/preset-layout-library-fold-ui.cjs
      - name: Attach visual UI screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ORCA-Nova-Preset-Layout-Screenshots
          path: ui-screenshots/*.png
          if-no-files-found: ignore
