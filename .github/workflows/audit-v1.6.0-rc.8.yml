name: Audit v1.6.0-rc.8 Public Release
on:
  push:
    branches: ['main', 'audit/rc8-public-assets-20261110']
    paths:
      - '.github/workflows/audit-v1.6.0-rc.8.yml'
      - 'tests/audit-public-rc-release.sh'
  pull_request:
    paths:
      - '.github/workflows/audit-v1.6.0-rc.8.yml'
      - 'tests/audit-public-rc-release.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-public-release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify public rc.8 ZIP SHA256, CRC, paths and latest stable
        run: bash tests/audit-public-rc-release.sh v1.6.0-rc.8 a339d9540000b93a2bd107ce71b3fa4dcd646be1 v1.5.1
