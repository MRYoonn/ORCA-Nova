name: Release Windows Portable
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'New release tag, e.g. v1.4.0'
        type: string
        required: true
        default: 'v1.4.0'
      prerelease:
        description: 'Test release; excluded from automatic stable updates'
        type: boolean
        required: true
        default: true
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag and branch
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Version must look like v1.4.0.' }
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ github.ref_name }}' -ne 'main') { throw 'Run manual releases from main.' }
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test backend
        run: go test ./...
      - name: Build versioned backend
        shell: pwsh
        run: |
          $version=$env:RELEASE_TAG.TrimStart('v')
          $env:CGO_ENABLED='0'
          New-Item -ItemType Directory -Force bin | Out-Null
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.appVersion=$version" -o bin/ORCA_Nova_raw.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python embed_icon.py bin/ORCA_Nova_raw.exe assets/ORCA_Nova.ico bin/ORCA_Nova.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build native WebView2 host
        shell: pwsh
        run: |
          dotnet restore native_host/ORCA_Nova_UI.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build native_host/ORCA_Nova_UI.csproj --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item bin/ORCA_Nova.exe dist/
          Copy-Item assets/ORCA_Nova.ico dist/
          $hostRoot = (Resolve-Path 'native_host/bin/Release/net48').Path
          Get-ChildItem -LiteralPath $hostRoot -Recurse -File | Where-Object { $_.Extension -in @('.dll', '.config') -or $_.Name -eq 'ORCA_Nova_UI.exe' } | ForEach-Object {
            $relative = $_.FullName.Substring($hostRoot.Length).TrimStart('\')
            $destination = Join-Path dist $relative
            New-Item -ItemType Directory -Force (Split-Path -Parent $destination) | Out-Null
            Copy-Item -LiteralPath $_.FullName -Destination $destination
          }
          if (-not (Test-Path dist/ORCA_Nova_UI.exe)) { throw 'native WebView2 host was not packaged' }
          Compress-Archive -Path dist/* -DestinationPath ORCA_Nova_Portable_Windows.zip -Force
          Get-FileHash ORCA_Nova_Portable_Windows.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  ORCA_Nova_Portable_Windows.zip" } | Set-Content SHA256SUMS.txt
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $cmd = @('release','create',$env:RELEASE_TAG,'ORCA_Nova_Portable_Windows.zip','SHA256SUMS.txt','--target',$env:GITHUB_SHA,'--generate-notes','--title',('ORCA Nova '+$env:RELEASE_TAG))
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.prerelease }}' -eq 'true') { $cmd += '--prerelease' }
          gh @cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
